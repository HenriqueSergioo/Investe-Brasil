<section class="page" *ngIf="detalhe">
  <article class="card formulario">
    <h2>Resgatar investimento</h2>

    <form (ngSubmit)="salvar()">
      <div class="grade">
        <label>
          ID
          <input type="text" [value]="detalhe.id" disabled>
        </label>
        <label>
          Proprietário
          <input type="text" [value]="detalhe.proprietario" disabled>
        </label>
        <label>
          Valor
          <input type="text" [value]="formatarMoeda(detalhe.saldoEsperado)" disabled>
        </label>
        <app-data
          titulo="Data do resgate"
          name="dataResgate"
          [(ngModel)]="dataResgate"
          [minimo]="detalhe.dataCriacao"
          [maximo]="hoje"
          [required]="true"
          (valorAlterado)="carregarSimulacao()">
        </app-data>
      </div>

      <div class="simulacao">
        <p>Ganhos: <strong>{{ formatarMoeda(detalhe.ganhos) }}</strong></p>
        <p>Imposto: <strong>{{ formatarMoeda(detalhe.valorImposto) }}</strong></p>
        <p>Valor líquido: <strong class="destaque">{{ formatarMoeda(detalhe.valorLiquido) }}</strong></p>
      </div>

      <button type="submit" class="botao primario">Salvar</button>
    </form>
  </article>
</section>
