<div class="resgate" *ngIf="detalhe">
  <h2>Resgatar investimento</h2>

  <form (ngSubmit)="salvar()">
    <article class="card formulario">
      <div class="grade">
        <label>
          Código
          <input type="text" [value]="detalhe.codigoInvestimento" disabled>
        </label>
        <label>
          Objetivo
          <input type="text" [value]="detalhe.descricaoObjetivo" disabled>
        </label>
        <label>
          Valor investido
          <input type="text" [value]="formatarMoeda(detalhe.valorInicial)" disabled>
        </label>
        <app-data
          titulo="Data do resgate"
          name="dataResgate"
          [(ngModel)]="dataResgate"
          [minimo]="detalhe.dataCriacao"
          [maximo]="hoje"
          [required]="true"
          (valorAlterado)="carregarSimulacao()">
        </app-data>
      </div>

      <div class="simulacao">
        <p>Ganhos: <strong>{{ formatarMoeda(detalhe.valorGanhos) }}</strong></p>
        <p>Imposto: <strong>{{ formatarMoeda(detalhe.valorImposto) }}</strong></p>
        <p>Valor líquido: <strong class="destaque">{{ formatarMoeda(detalhe.valorLiquido) }}</strong></p>
      </div>

      <div class="acoes-formulario">
        <button type="submit" class="botao perigo">Resgatar</button>
        <button type="button" class="botao secundario" (click)="voltar()">Voltar</button>
      </div>
    </article>
  </form>
</div>
