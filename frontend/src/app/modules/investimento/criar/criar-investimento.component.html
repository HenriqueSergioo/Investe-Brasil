<section class="page">
  <article class="card formulario">
    <h2>Criar investimento</h2>
    <p class="rotulo">Preencha os dados do titular e da aplicação, no mesmo recorte de um cadastro de CDB ou tesouro.</p>

    <form (ngSubmit)="salvar()">
      <h3>Titular</h3>
      <div class="grade">
        <label>
          Proprietário
          <input type="text" [(ngModel)]="proprietario" name="proprietario" required maxlength="200">
        </label>
        <label>
          CPF
          <input type="text" [ngModel]="cpf" name="cpf" (ngModelChange)="mascararCpf($event)" required maxlength="14" placeholder="000.000.000-00">
        </label>
      </div>

      <h3>Aplicação</h3>
      <div class="grade">
        <label>
          Tipo
          <select [(ngModel)]="tipoInvestimento" name="tipoInvestimento" required>
            <option value="" disabled>Selecione</option>
            <option *ngFor="let tipo of tipos" [value]="tipo">{{ tipo }}</option>
          </select>
        </label>
        <label>
          Instituição
          <input type="text" [(ngModel)]="instituicao" name="instituicao" required maxlength="120" placeholder="Banco ou corretora">
        </label>
        <app-moeda titulo="Valor aplicado" name="valorInicial" [(ngModel)]="valorInicial" [required]="true"></app-moeda>
        <app-data titulo="Data da aplicação" name="dataCriacao" [(ngModel)]="dataCriacao" [maximo]="hoje" [required]="true"></app-data>
        <app-data titulo="Vencimento" name="dataVencimento" [(ngModel)]="dataVencimento" [minimo]="dataCriacao"></app-data>
        <label>
          Liquidez
          <select [(ngModel)]="liquidez" name="liquidez" required>
            <option value="" disabled>Selecione</option>
            <option *ngFor="let item of liquideces" [value]="item">{{ item }}</option>
          </select>
        </label>
        <label>
          Objetivo
          <select [(ngModel)]="objetivo" name="objetivo" required>
            <option value="" disabled>Selecione</option>
            <option *ngFor="let item of objetivos" [value]="item">{{ item }}</option>
          </select>
        </label>
      </div>

      <h3>Observações</h3>
      <label class="observacao">
        Observação
        <textarea [(ngModel)]="observacao" name="observacao" maxlength="500" rows="3" placeholder="Opcional"></textarea>
      </label>

      <button type="submit" class="botao primario">Salvar</button>
    </form>
  </article>
</section>
