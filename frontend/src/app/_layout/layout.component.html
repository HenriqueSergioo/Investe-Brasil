<button type="button" class="menu-toggle" (click)="alternarMenu()" aria-label="Abrir menu">
  <span></span>
  <span></span>
  <span></span>
</button>

<div class="menu-fundo" *ngIf="menuAberto" (click)="fecharMenu()"></div>

<aside class="app-sidebar" [class.aberto]="menuAberto">
  <a routerLink="/investimentos" class="app-sidebar-logo" (click)="fecharMenu()">
    <img src="assets/images/logo-investebrasil.svg" alt="InvesteBrasil">
    <span>InvesteBrasil</span>
  </a>

  <nav class="app-sidebar-menu">
    <a
      *ngFor="let item of menu"
      class="menu-link"
      [routerLink]="item.link"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: item.exato }"
      (click)="fecharMenu()">
      <span class="menu-icon" [attr.data-icone]="item.icone"></span>
      <span class="menu-title">{{ item.title }}</span>
    </a>
  </nav>

  <div class="app-sidebar-footer">
    <button type="button" (click)="sair()">Sair</button>
  </div>
</aside>

<div class="app-main">
  <header class="app-header">
    <h1>{{ tituloPagina() }}</h1>
  </header>
  <main>
    <router-outlet></router-outlet>
  </main>
</div>
